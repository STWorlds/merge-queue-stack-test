name: ci
on:
  pull_request:
    branches: [develop]
  merge_group:
    types: [checks_requested]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "ok" && test -f README.md
      - name: merge-group experiment guards
        if: github.event_name == 'merge_group'
        run: |
          if [ -f .mg-fail-solo ]; then
            echo "E1: intentional solo merge_group failure"
            exit 1
          fi
          if [ -f .mg-marker-b1 ] && [ -f .mg-marker-b2 ]; then
            echo "E2: intentional combined merge_group failure"
            exit 1
          fi
